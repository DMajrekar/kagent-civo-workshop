name: check

# Catches the class of bug that actually bit us while building this: a syntax
# error or an unbound variable in a step script, a values file that no longer
# parses. None of it needs cloud credentials, so it runs on every push.
on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: we source lib.sh by a computed path.
          # SC2086: deliberate word splitting when building helm flag lists.
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -S warning -e SC1091,SC2086 || true

      - name: Python syntax
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -m py_compile "$f" || { echo "::error file=$f::python syntax error"; fail=1; }
          done < <(find . -name '*.py' -not -path './.git/*')
          exit $fail

      - name: YAML parses
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              if '.git' in f: continue
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  print(f"::error file={f}::{e}"); bad = 1
          sys.exit(bad)
          PY

      - name: Every step has a title
        run: |
          fail=0
          for d in hub/step-*; do
            grep -q '^# title: ' "$d/run.sh" || {
              echo "::error file=$d/run.sh::missing '# title:' line (make help reads it)"; fail=1; }
          done
          exit $fail

      - name: No double enter-prompts
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for f in sorted(glob.glob('**/run.sh', recursive=True)):
              lines = open(f).read().split('\n')
              for i, l in enumerate(lines):
                  if not re.match(r'\s*pause\b', l):
                      continue
                  j = i + 1
                  while j < len(lines) and (not lines[j].strip() or lines[j].strip().startswith('#')):
                      j += 1
                  nxt = lines[j].strip() if j < len(lines) else ''
                  if nxt.startswith(('run ', 'run_quiet ')):
                      bad.append((f, i + 1))
          for f, n in bad:
              print(f"::error file={f},line={n}::pause directly before run/run_quiet "
                    f"makes the presenter press enter twice; run already pauses")
          sys.exit(1 if bad else 0)
          PY

      - name: Flags are answerable
        run: |
          python3 - <<'PY'
          # Every flag must accept its own documented answer, and the flag
          # table in docs/INCIDENTS.md must list every flag the app serves.
          import importlib.util, os, re, sys
          os.environ["CTF_SECRET"] = "ci"
          spec = importlib.util.spec_from_file_location("ctf", "hub/step-07-ctf/ctf.py")
          ctf = importlib.util.module_from_spec(spec); spec.loader.exec_module(ctf)
          doc = open("docs/INCIDENTS.md").read()
          rows = dict(re.findall(r"^\| `([a-z]+)` \|.*\| `([^`]+)` \|\s*$", doc, re.M))
          bad = 0
          for f in ctf.FLAGS:
              ans = rows.get(f["id"])
              if ans is None:
                  print(f"::error file=docs/INCIDENTS.md::flag {f['id']} is not in the flag table"); bad = 1
              elif not ctf.check_flag(f, ans):
                  print(f"::error file=hub/step-07-ctf/ctf.py::flag {f['id']} rejects its documented answer {ans!r}"); bad = 1
          for extra in set(rows) - {f["id"] for f in ctf.FLAGS}:
              print(f"::error file=docs/INCIDENTS.md::flag table lists {extra}, which the app does not serve"); bad = 1
          print(f"{len(ctf.FLAGS)} flags checked")
          sys.exit(bad)
          PY

      - name: Charts and images are pinned
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for f in sorted(glob.glob('**/run.sh', recursive=True)):
              src = open(f).read()
              for m in re.finditer(r'helm upgrade --install\s+(\S+)[^"]*?"', src, re.S):
                  if '--version' not in m.group(0):
                      bad.append(f"{f}: helm install of {m.group(1)} has no --version")
              for m in re.finditer(r'IMAGE:-([^}\s]+)', src):
                  ref = m.group(1)
                  if ref.endswith(':latest') or (':' not in ref and '@' not in ref):
                      bad.append(f"{f}: image {ref} is unpinned")
          for b in bad:
              print(f"::error::{b}")
          print("all charts and images pinned" if not bad else "")
          sys.exit(1 if bad else 0)
          PY

      - name: No credentials committed
        run: |
          if git grep -nE 'rak_[A-Za-z0-9]{20,}|glsa_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY' \
               -- . ':!.github/workflows/check.yml' | grep -v PLACEHOLDER; then
            echo "::error::something that looks like a credential is committed"
            exit 1
          fi
          echo "clean"
