# kagent-guard: the only way from the dashboard to the kagent controller.
#
# The controller's API has no notion of "a player may chat but not edit". This
# adds one. Reads are open; writes are refused unless they are part of having
# a conversation. Agents, models and tool servers can then only be changed
# with kubectl, which is how the instructor adds agents during the session.

map $request_method $guard_read {
    default 0;
    GET     1;
    HEAD    1;
    OPTIONS 1;
}

# Never let a request reach the controller with no identity: the controller
# would file it under "admin@kagent.dev", a single user shared by everyone.
map $http_x_user_id $guard_user {
    default $http_x_user_id;
    ""      "guest@ctf";
}

upstream kagent_controller {
    server kagent-controller.kagent.svc.cluster.local:8083;
    keepalive 16;
}

server {
    listen 8080;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ?user_id= outranks the identity header inside the controller, so it is
    # a way to read someone else's chats. Nothing the dashboard needs for a
    # conversation uses it.
    if ($arg_user_id != "") {
        return 403 '{"error":"user_id may not be set by the client"}';
    }

    # Having a conversation: talking to an agent, and keeping the history.
    location ~ ^/api/(a2a/kagent/|sessions(/|$)|tasks(/|$)|feedback(/|$)) {
        include /etc/nginx/guard/proxy.inc;
    }

    # Direct tool calls would skip the agent entirely.
    location ~ ^/api/(mcp|mcpapps)(/|$) {
        default_type application/json;
        return 403 '{"error":"not available in the workshop"}';
    }

    location / {
        if ($guard_read = 0) {
            return 403 '{"error":"read-only in the workshop: agents are added by the instructor"}';
        }
        include /etc/nginx/guard/proxy.inc;
    }
}
