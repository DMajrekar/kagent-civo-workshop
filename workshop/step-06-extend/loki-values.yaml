# Loki for an attendee's own cluster: the hub's stack, scaled down to sit
# alongside kagent on two small nodes. Same settings that matter (backfill
# acceptance, fast flush), smaller everything else.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  storage: { type: filesystem }
  limits_config:
    reject_old_samples: false
    reject_old_samples_max_age: 336h
    max_query_series: 500
    max_entries_limit_per_query: 5000
    retention_period: 336h
  ingester:
    chunk_idle_period: 1m
    max_chunk_age: 2h          # do NOT shrink: this sets the out-of-order window
  querier:
    max_concurrent: 4
    query_ingesters_within: 336h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 1Gi }
  persistence: { enabled: true, size: 10Gi }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
memcached: { enabled: false }
memcachedResults: { enabled: false }
memcachedChunks: { enabled: false }
memcachedFrontend: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway: { enabled: false }
monitoring:
  dashboards: { enabled: false }
  rules: { enabled: false }
  serviceMonitor: { enabled: false }
  selfMonitoring: { enabled: false, grafanaAgent: { installOperator: false } }
